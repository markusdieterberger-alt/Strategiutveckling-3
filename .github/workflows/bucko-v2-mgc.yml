name: Bucko V2 MGC Python research

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout frozen source
        uses: actions/checkout@v4
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check numpy pandas google-auth requests
      - name: Check private Google credentials configured
        env:
          DRIVE_SECRET_CONFIGURED: ${{ secrets.MGC_GDRIVE_SA_JSON != '' }}
        run: |
          if [ "$DRIVE_SECRET_CONFIGURED" != "true" ]; then
            echo "::error::Missing GitHub Actions secret MGC_GDRIVE_SA_JSON. See bucko-inspired/research-v2/PRIVATE_DRIVE_SETUP.md"
            exit 1
          fi
      - name: Authenticate with Google service account
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.MGC_GDRIVE_SA_JSON }}
          create_credentials_file: true
          export_environment_variables: true
      - name: Download private canonical MGC and verify checksum
        run: python bucko-inspired/research-v2/download_private_mgc.py
      - name: Run preregistered V2 simulations
        run: python bucko-inspired/research-v2/bucko_mgc_v2.py data/MGC_CANONICAL_1M_V1_0_2026-10-05.csv.gz --out results
      - name: Record source provenance
        if: success()
        run: |
          git rev-parse HEAD > results/code_commit.txt
          sha256sum data/MGC_CANONICAL_1M_V1_0_2026-10-05.csv.gz > results/data_sha256.txt
      - name: Upload result ledgers
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bucko-v2-mgc-results
          path: results/
          if-no-files-found: warn
          retention-days: 30
